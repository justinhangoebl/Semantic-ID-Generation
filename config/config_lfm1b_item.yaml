# Data loader configuration
data:
  dataset: "lastfm"
  batch_size: 16
  normalize_data: False
  category: "1b"
  embedding_dimension: "item" # 'user' or 'item' or 'relation' or 'entity'

# Model configuration
model:
  input_dimension: 768
  hidden_dimensions: [1024, 512, 256]
  latent_dimension: 128
  num_codebook_layers: 3
  codebook_clusters: 256
  commitment_weight: 0.25
  # Quantization method: "ste" (Straight-Through Estimation) or "gumbel_softmax"
  quantization_method: "gumbel_softmax"

# Training configuration
train:
  learning_rate: 0.001
  weight_decay: 0.001
  num_epochs: 1024

  # Temperature annealing (for Gumbel Softmax)
  temperature_annealing: True
  temperature_update_frequency: 1 # Update temperature every epoch
  annealing_schedule: "exponential"

  # Gumbel Softmax parameters
  temperature: 1.75 # Higher initial temperature for softer assignments
  min_temperature: 0.5 # Lower minimum for sharper final assignments
  temperature_decay: 0.99 # Slower decay for gradual annealing
  validation_step: 10

# Additional configuration
general:
  use_wandb: True
  wandb_project: "semantic_id_ml_1m_item_gumbel"
  wandb_entity: "justin-hangoebl-master-thesis"
  save_model: True
