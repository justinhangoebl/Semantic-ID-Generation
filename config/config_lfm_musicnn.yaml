# Data loader configuration
data:
  dataset: "lfm"
  batch_size: 64
  normalize_data: False
  embedding_dimension: "musicnn" # pre-computed 50-dim MusicNN audio embeddings

# Model configuration
model:
  input_dimension: 50
  hidden_dimensions: [128, 64, 32]
  latent_dimension: 512
  num_codebook_layers: 3
  codebook_clusters: 256
  commitment_weight: 0.25
  # Quantization method: "ste" (Straight-Through Estimation) or "gumbel_softmax"
  quantization_method: "gumbel_softmax"

# Training configuration
train:
  learning_rate: 0.0002
  weight_decay: 0.0001
  num_epochs: 1024

  # Temperature annealing (for Gumbel Softmax)
  temperature_annealing: True
  temperature_update_frequency: 1 # Update temperature every epoch
  annealing_schedule: "inverse_log"

  # Gumbel Softmax parameters
  temperature: 1.75 # Higher initial temperature for softer assignments
  min_temperature: 0.3 # Lower minimum for sharper final assignments
  temperature_decay: 0.9 # Slower decay for gradual annealing
  validation_step: 50
  metric_eval_samples: 50000

# Additional configuration
general:
  use_wandb: True
  wandb_project: "semantic_id_lfm_musicnn"
  wandb_entity: "justin-hangoebl-master-thesis"
  save_model: True
